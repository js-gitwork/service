{% load i18n static %}
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPRepair</title>
    <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <!-- Velkomsttekst og flag-knapper -->
    <div class="language-container">
        <div class="welcome-text" data-i18n="welcome">
            Velkommen til VP-fejlrapportering
        </div>
        <div class="language-selector">
            <button class="lang-btn" data-lang="da">
                <img src="{% static 'flag/dk.png' %}" alt="Dansk" class="flag-icon">
            </button>
            <button class="lang-btn" data-lang="en">
                <img src="{% static 'flag/uk.png' %}" alt="English" class="flag-icon">
            </button>
            <button class="lang-btn" data-lang="pl">
                <img src="{% static 'flag/pl.png' %}" alt="Polski" class="flag-icon">
            </button>
            <button class="lang-btn" data-lang="de">
                <img src="{% static 'flag/de.png' %}" alt="Deutsch" class="flag-icon">
            </button>
        </div>
        <p class="credit-text">
            Flag icons made by Freepik from <a href="https://www.flaticon.com" target="_blank">www.flaticon.com</a>
        </p>
    </div>

    <!-- Søgefelt og Scan QR-knap -->
    <input type="text" id="search" class="search-input" placeholder="Søg efter aktiv eller scan QR..." data-i18n="search-placeholder">
    <button id="scan-btn" class="btn btn-primary" data-i18n="scan-qr">Scan QR</button>

    <!-- Asset-liste -->
    <div id="asset-list-container" class="asset-list-container">
        <div id="asset-list" class="asset-list" data-i18n-container="asset-list">
            {% for asset in assets %}
            <div class="asset-item" data-vpid="{{ asset.VPID }}" onclick="selectAsset('{{ asset.VPID }}', this)">
                <strong>{{ asset.VPID }}</strong> - {{ asset.name }}
                {% if asset.description %}
                    <div class="asset-description">{{ asset.description }}</div>
                {% endif %}
            </div>
            {% empty %}
            <div class="asset-item" data-i18n="asset-list-empty">Ingen aktiver fundet.</div>
            {% endfor %}
        </div>
    </div>

    <!-- Fejlrapport-formular -->
    <form id="report-form" class="report-form">
        <input type="hidden" id="sprog-input" name="sprog" value="da">
        <div class="form-group">
            <label for="description" data-i18n="description-label">Fejlbeskrivelse for: <strong id="selected-asset-label" data-i18n="no-asset-selected">Ingen valgt</strong></label>
            <textarea id="description" class="form-control" rows="3" required data-i18n-placeholder="description-placeholder"></textarea>
        </div>
        <div class="button-group">
            <button type="button" id="camera-btn" class="btn btn-secondary" data-i18n="choose-image">Billede</button>
            <button type="submit" class="btn btn-primary" data-i18n="submit-report">Indsend</button>
        </div>
    </form>

    <!-- Billede-preview -->
    <img id="preview" class="image-preview hidden" alt="Preview">

    <!-- JavaScript med dynamisk oversættelse -->
    <script>
        // Oversættelsesdata
        const translations = {
            da: {
                welcome: "Velkommen til VP-fejlrapportering",
                "search-placeholder": "Søg efter aktiv eller scan QR...",
                "scan-qr": "Scan QR",
                "choose-image": "Billede",
                "submit-report": "Indsend",
                "description-label": "Fejlbeskrivelse for:",
                "no-asset-selected": "Ingen valgt",
                "asset-list-empty": "Ingen aktiver fundet",
                "report-submitted": "Rapport indsendt!",
                "description-placeholder": "Indtast fejlbeskrivelse her..."
            },
            en: {
                welcome: "Welcome to VP Fault Reporting",
                "search-placeholder": "Search for asset or scan QR...",
                "scan-qr": "Scan QR",
                "choose-image": "Photo",
                "submit-report": "Submit",
                "description-label": "Fault description for:",
                "no-asset-selected": "None selected",
                "asset-list-empty": "No assets found",
                "report-submitted": "Report submitted!",
                "description-placeholder": "Enter fault description here..."
            },
            pl: {
                welcome: "Witaj w systemie zgłaszania usterek VP",
                "search-placeholder": "Wyszukaj aktywo lub zeskanuj kod QR...",
                "scan-qr": "Skanuj QR",
                "choose-image": "Zdjęcie",
                "submit-report": "Wyślij",
                "description-label": "Opis usterki dla:",
                "no-asset-selected": "Nie wybrano",
                "asset-list-empty": "Nie znaleziono aktywów",
                "report-submitted": "Raport wysłany!",
                "description-placeholder": "Wprowadź opis usterki tutaj..."
            },
            de: {
                welcome: "Willkommen im VP-Fehlermeldesystem",
                "search-placeholder": "Nach Asset suchen oder QR-Code scannen...",
                "scan-qr": "QR scannen",
                "choose-image": "Foto",
                "submit-report": "Senden",
                "description-label": "Fehlerbeschreibung für:",
                "no-asset-selected": "Keine ausgewählt",
                "asset-list-empty": "Keine Assets gefunden",
                "report-submitted": "Bericht gesendet!",
                "description-placeholder": "Geben Sie hier die Fehlerbeschreibung ein..."
            }
        };

        let selectedAssetVPID = null;
        let currentLang = 'da';

        // Sprogskift for flag-knapper
        document.querySelectorAll('.lang-btn').forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                currentLang = this.dataset.lang;
                document.getElementById('sprog-input').value = currentLang;
                updateTexts();
            });
        });

        // Oversæt alle tekster
        function updateTexts() {
            // Oversæt statiske tekster
            document.querySelector('[data-i18n="welcome"]').textContent = translations[currentLang].welcome;
            document.querySelector('[data-i18n="search-placeholder"]').placeholder = translations[currentLang]["search-placeholder"];
            document.querySelector('[data-i18n="scan-qr"]').textContent = translations[currentLang]["scan-qr"];
            document.querySelector('[data-i18n="choose-image"]').textContent = translations[currentLang]["choose-image"];
            document.querySelector('[data-i18n="submit-report"]').textContent = translations[currentLang]["submit-report"];
            document.querySelector('[data-i18n="description-label"]').textContent = translations[currentLang]["description-label"];
            document.querySelector('[data-i18n="no-asset-selected"]').textContent =
                selectedAssetVPID || translations[currentLang]["no-asset-selected"];

            // Oversæt placeholder for tekstfelt
            document.getElementById('description').placeholder = translations[currentLang]["description-placeholder"];

            // Oversæt "Ingen aktiver fundet" hvis listen er tom
            const emptyMessage = document.querySelector('[data-i18n="asset-list-empty"]');
            if (emptyMessage) {
                emptyMessage.textContent = translations[currentLang]["asset-list-empty"];
            }
        }

        // Resten af din JavaScript (uændret)
        function resetSearch() {
            document.getElementById('search').value = '';
            loadAssets();
        }

        async function loadAssets(searchTerm = '') {
            const assetList = document.getElementById('asset-list');
            try {
                const url = searchTerm ? `/api/assets/?search=${encodeURIComponent(searchTerm)}` : '/api/assets/';
                const response = await fetch(url);
                const assets = await response.json();
                assetList.innerHTML = assets.length > 0
                    ? assets.map(asset =>
                        `<div class="asset-item ${selectedAssetVPID === asset.VPID ? 'selected' : ''}"
                             data-vpid="${asset.VPID}"
                             onclick="selectAsset('${asset.VPID}', this)">
                            <strong>${asset.VPID}</strong> - ${asset.name}
                            ${asset.description ? `<div class="asset-description">${asset.description}</div>` : ''}
                        </div>`
                    ).join('')
                    : `<div class="asset-item" data-i18n="asset-list-empty">${translations[currentLang]["asset-list-empty"]}</div>`;
            } catch (error) {
                console.error("Fejl:", error);
                assetList.innerHTML = `<div class="asset-item" data-i18n="asset-list-empty">${translations[currentLang]["asset-list-empty"]}</div>`;
            }
        }

        function selectAsset(vpid, element) {
            document.querySelectorAll('.asset-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedAssetVPID = vpid;
            document.getElementById('search').value = vpid;
            document.getElementById('selected-asset-label').textContent = vpid;
            updateTexts();
        }

        document.getElementById('search').addEventListener('input', function(e) {
            const searchTerm = e.target.value.trim();
            if (searchTerm.length >= 2) {
                loadAssets(searchTerm);
            } else if (searchTerm.length === 0) {
                loadAssets();
            }
        });

        document.getElementById('scan-btn').addEventListener('click', function() {
            const simulatedQR = prompt(translations[currentLang]["search-placeholder"]);
            if (simulatedQR) {
                document.getElementById('search').value = simulatedQR;
                loadAssets(simulatedQR);
            }
        });

        document.getElementById('camera-btn').addEventListener('click', function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.capture = 'environment';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        document.getElementById('preview').src = event.target.result;
                        document.getElementById('preview').classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        });

        document.getElementById('report-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const description = document.getElementById('description').value;
            const preview = document.getElementById('preview');
            const vpid = selectedAssetVPID || document.getElementById('search').value.trim();
            if (!vpid) {
                alert(translations[currentLang]["no-asset-selected"]);
                return;
            }
            const imageData = preview.classList.contains('hidden') ? null : preview.src;
            const sprog = document.getElementById('sprog-input').value;
            try {
                const response = await fetch('/api/reports/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        VPID: vpid,
                        description: description,
                        image: imageData,
                        sprog: sprog
                    })
                });
                const data = await response.json();
                if (data.status === 'success') {
                    alert(translations[currentLang]["report-submitted"]);
                    e.target.reset();
                    preview.classList.add('hidden');
                    selectedAssetVPID = null;
                    document.getElementById('selected-asset-label').textContent =
                        translations[currentLang]["no-asset-selected"];
                    resetSearch();
                } else {
                    alert(data.message || translations[currentLang]["report-submitted"]);
                }
            } catch (error) {
                alert(translations[currentLang]["report-submitted"]);
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            updateTexts();
            loadAssets();
        });
    </script>
</body>
</html>
