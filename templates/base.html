{% load static %}
<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Service-system{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Din lokale CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <!-- MEKANIKER-SKIFT KNAP (vises kun hvis man er logget ind som en anden) -->
    {% if user.is_authenticated and original_user_id %}
        <div class="alert alert-warning mb-0 text-center" role="alert">
            Du er logget ind som <strong>{{ user.get_full_name }}</strong>.
            <form method="post" action="{% url 'switch_back' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline-danger ms-2">
                    Log ud som {{ user.username }} → Vend tilbage
                </button>
            </form>
        </div>
    {% endif %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
