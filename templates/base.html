<!DOCTYPE html>
<html lang="da">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if user.is_authenticated %}
            {{ user.get_full_name }} | VPRepair
        {% else %}
            VPRepair
        {% endif %}
    </title>
    <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <!-- Bjælke med "Ventende opgaver", logget bruger og log ud-knap -->
    <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div style="color: var(--header-text-color); font-size: 1.2rem; font-weight: bold;">
                Ventende opgaver
            </div>
            <div style="color: var(--header-text-color); font-size: 1rem;">
                {{ user.get_full_name|default:user.username }}
            </div>
            <form method="post" action="{% url 'logout' %}" style="margin: 0;">
                {% csrf_token %}
                <button type="submit" class="btn">Log ud</button>
            </form>
        </div>
    </div>

    <!-- Indhold (dine sider indsættes her) -->
    {% block content %}{% endblock %}
</body>
</html>
